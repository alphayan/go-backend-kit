name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Download modules
        run: go mod download
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Unit and generated-project tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go tool govulncheck ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: kit_test
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kit:kit@localhost:5432/kit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - name: PostgreSQL migration and contract test
        run: ./scripts/postgres-e2e.sh

  session-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: kit_session_test
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit_session_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kit:kit@localhost:5432/kit_session_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Session migration and generated-project verification
        run: ./scripts/session-e2e.sh

  production-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Isolated production roles, migrations and restore
        env:
          GOBACKEND_POSTGRES_SECURITY_E2E: "1"
        run: go test -v ./internal/generate -run '^TestProductionPostgresSecurity$' -count=1

  session-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Generated Session frontend verification
        run: ./scripts/frontend-e2e.sh
      - name: Production Session TLS browser boundaries
        run: ./scripts/frontend-e2e.sh production
